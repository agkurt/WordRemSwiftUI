name = "wordrem-voice"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Kendi alan adımız: bazı mobil operatörler *.workers.dev adreslerini engelliyor
# Eski sürümler workers.dev adresini kullanmaya devam eder
workers_dev = true
routes = [
  { pattern = "api.wordremai.app", custom_domain = true }
]

# Kullanım sayaçları (dakika sınırları) — `npx wrangler kv namespace create USAGE` çıktısındaki id ile doldurun
[[kv_namespaces]]
binding = "USAGE"
id = "218266adf42b40ecbb1c2a88bd34d8de"

[vars]
# gpt-realtime / gpt-realtime-mini 20 Ocak 2027'de kapanıyor; yerine 2.1 sürümleri
REALTIME_MODEL = "gpt-realtime-2.1-mini"
# Onboarding ve dersler de mini (maliyet); tam model: gpt-realtime-2.1, çarpan 3.2
REALTIME_MODEL_HIGH = "gpt-realtime-2.1-mini"
# Tam modelin mini'ye göre ses fiyatı oranı (32/10, 64/20)
HIGH_COST_MULTIPLIER = "1"
# Üç parçalı ses denemesi (yazıya çevir → yazı modeli → seslendir): yazı modeli ve düşünme düzeyi
CASCADE_MODEL = "gpt-6-luna"
CASCADE_REASONING = "none"
VOICE = "marin"
RC_ENTITLEMENT = "premium"
# Saniye cinsinden sınırlar
FREE_TASTE_SECONDS = "180"
# Aynı IP'den günde en fazla bu kadar yeni ücretsiz kullanıcı (sahte kullanıcı üreten scriptlere karşı)
FREE_NEW_USERS_PER_IP_DAY = "20"
SESSION_MAX_SECONDS = "600"
TRIAL_DAILY_SECONDS = "600"
# Pro: günlük/aylık sınır yok; tek oturum en fazla 60 dk (OpenAI oturum sınırına yakın)
PRO_SESSION_SECONDS = "3600"
PRO_DAILY_SECONDS = "1800"   # kullanılmıyor (Pro sınırsız)
# Aylık sınır ödenen fiyattan hesaplanır, bu aralıkta tutulur
MIN_MONTHLY_SECONDS = "1800"
PRO_MONTHLY_SECONDS = "18000"
# Konuşma dakikası başı maliyet (gpt-realtime-mini, temkinli; sessizlik sayılmaz) ve net gelirin AI'a ayrılan payı
COST_PER_MIN_USD = "0.025"
AI_BUDGET_SHARE = "0.7"
APPLE_COMMISSION = "0.15"

# Gizli değerler (panelden ya da `npx wrangler secret put <AD>` ile):
#   OPENAI_API_KEY   — OpenAI API anahtarı
#   RC_SECRET_KEY    — RevenueCat v1 gizli anahtarı (sk_...)
#   APP_SHARED_KEY   — uygulamanın gönderdiği X-App-Key başlığı (rastgele uzun bir metin)

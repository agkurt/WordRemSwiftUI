name = "wordrem-voice"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Kullanım sayaçları (dakika sınırları) — `npx wrangler kv namespace create USAGE` çıktısındaki id ile doldurun
[[kv_namespaces]]
binding = "USAGE"
id = "218266adf42b40ecbb1c2a88bd34d8de"

[vars]
REALTIME_MODEL = "gpt-realtime-mini"
VOICE = "coral"
RC_ENTITLEMENT = "premium"
# Saniye cinsinden sınırlar
FREE_TASTE_SECONDS = "300"
SESSION_MAX_SECONDS = "600"
TRIAL_DAILY_SECONDS = "600"
PRO_DAILY_SECONDS = "1800"
# Aylık sınır ödenen fiyattan hesaplanır, bu aralıkta tutulur
MIN_MONTHLY_SECONDS = "1800"
PRO_MONTHLY_SECONDS = "18000"
# Konuşma dakikası başı maliyet (gpt-realtime-mini, temkinli; sessizlik sayılmaz) ve net gelirin AI'a ayrılan payı
COST_PER_MIN_USD = "0.025"
AI_BUDGET_SHARE = "0.7"
APPLE_COMMISSION = "0.15"

# Gizli değerler (panelden ya da `npx wrangler secret put <AD>` ile):
#   OPENAI_API_KEY   — OpenAI API anahtarı
#   RC_SECRET_KEY    — RevenueCat v1 gizli anahtarı (sk_...)
#   APP_SHARED_KEY   — uygulamanın gönderdiği X-App-Key başlığı (rastgele uzun bir metin)
